id: engine-ollama
version: "1"
display_name: "Ollama inference engine"
description: "Ollama inference pod: llama.cpp model management, Ollama tag and HuggingFace GGUF resolution, /api/chat protocol with native tool-calling support. Served at a configurable node port, model cache persisted to a PVC or RAM-backed emptyDir."
kind: engine
priority_class: epn-interactive
substrate: pod
network:
  # Reached by this gram's own daemon; the port is allocated by the
  # gram (cluster.GramPorts), never written here (D89).
  reach: gram
  proto: http
