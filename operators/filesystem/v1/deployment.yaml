apiVersion: apps/v1
kind: Deployment
metadata:
  name: epn-filesystem
  namespace: epn-system
  labels:
    app: epn-filesystem
    epn.io/operator: epn.filesystem.v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: epn-filesystem
  template:
    metadata:
      labels:
        app: epn-filesystem
        epn.io/operator: epn.filesystem.v1
    spec:
      containers:
        - name: filesystem
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: epn-filesystem-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: epn-filesystem-pvc
  namespace: epn-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
